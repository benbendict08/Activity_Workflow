
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minecraft Product List</title>
  <link rel="stylesheet" href="prodlist.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <img class="mine_logo" src="images/mine_logo.png" alt="Diamond Pickaxe">
        <button class="cart-button">Checkout</button>
      </header>
          
  <div class="featured-products">
    <!-- You can add text or other content inside -->
  </div>
  
  
  <main class="product-grid">
    <!-- Repeat this block for 16 products -->
    <div class="product-card">
      <img src="https://i.imgur.com/LKOmN4x.png" alt="Diamond Pickaxe">
      <h2>Diamond Pickaxe</h2>
      <p>₱500</p>
    </div>
    <div class="product-card">
      <img src="https://i.imgur.com/DV1sDbA.png" alt="Creeper Plush">
      <h2>Creeper Plush</h2>
      <p>₱300</p>
    </div>
    <div class="product-card">
      <img src="https://i.imgur.com/OAd4MfF.png" alt="Minecraft T-Shirt">
      <h2>Minecraft T-Shirt</h2>
      <p>₱450</p>
    </div>
    <div class="product-card">
      <img src="https://i.imgur.com/8HG8skD.png" alt="Redstone Torch">
      <h2>Redstone Torch</h2>
      <p>₱250</p>
    </div>
    <!-- Add 12 more product cards similarly -->
  </main>
</body>
</html>

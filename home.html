<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .nav-links {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            margin: 0 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff4d4d;
        }

        .nav-icons {
            display: flex;
            gap: 15px;
        }

        .nav-icons .icon {
            font-size: 22px;
            cursor: pointer;
            color: #333;
        }

        .nav-icons .icon:hover {
            color: #ff4d4d;
        }

        .home-content {
            margin-top: 100px;  /* Adjusted for the fixed nav */
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .home-content h1 {
            font-size: 40px;
            color: #333;
            margin-bottom: 20px;
        }

        .home-content p {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .cta-button {
            background-color: #ff4d4d;
            color: #fff;
            padding: 12px 25px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #e63939;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;  /* Hide navigation links on small screens */
            }
            .home-content h1 {
                font-size: 30px;
            }
            .home-content p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="logo">E-Shop</div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
        <div class="nav-icons">
            <span class="icon">🔍</span>
            <span class="icon" id="cart-btn">🛒 (<span id="cart-count">0</span>)</span>
            <span class="icon" id="account-btn">👤</span>
        </div>
    </nav>

    <!-- Home Content Section -->
    <section class="home-content">
        <h1>Welcome to E-Shop!</h1>
        <p>Your one-stop shop for all the best sneakers.</p>
        <p><a href="products.html" class="cta-button">Check out our products</a></p>
    </section>

    <script src="home.js"></script>
</body>
</html>
